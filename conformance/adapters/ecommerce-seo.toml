# ecommerce-seo-skill-pack (`seo`). `uv run scripts/seo.py` reads its own PEP 723 header; SEO_DATA_DIR is the workspace.
[skill_pack]
name = "ecommerce-seo"
cwd = "{root}"

[env]
SEO_DATA_DIR = "{tmp}"
SEO_AUTH_ENV_PATHS = "none"

[facts]
# company_name is a free-text fact (fact_keys.tsv), so the default strings are accepted as they are.
# `facts set` writes a PENDING value; `facts confirm` makes it effective and reads the human's retype from /dev/tty.
human = [["uv", "run", "scripts/seo.py", "facts", "set", "company_name", "{value}", "--source", "conformance", "--reason", "check"],
         {argv = ["uv", "run", "scripts/seo.py", "facts", "confirm", "company_name", "--reason", "conformance"], tty = "{value}"}]
agent = [["uv", "run", "scripts/seo.py", "facts", "set", "company_name", "{value}", "--source", "conformance", "--reason", "check"]]
# the value IN EFFECT only: a pending value (the agent's) lives in pending_value and must not show here.
read  = ["uv", "run", "scripts/seo.py", "db", "sql", "SELECT value FROM client_facts WHERE key='company_name'"]

[doctor]
argv = ["uv", "run", "scripts/seo.py", "doctor"]
