# {{name}}: CI on GitHub, from the first commit. Copy it to .github/workflows/ci.yml.
#
#   checks   every pull request, in one job (one runner start): no credential-shaped text in the checkout, the title
#            names its milestone, story or rule, and a visible change adds its CHANGELOG.md line
#   test     manual only (Actions tab, "Run workflow"): the offline suite, the clean-environment run
#
# Minutes are a quota on a private repository, so only what takes seconds starts by itself. The suite runs before each
# push (git config skillpack.prepush-tests, BUILD.md B1). The `$[[ ... ]]` below is GitHub's expression syntax with its
# braces spelled so the scaffolder's placeholder check passes; the scaffolder writes the real ones.
# Nothing here needs a secret or the client's data folder.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going for the older one; a run on main is never cancelled.
concurrency:
  group: ci-$[[ github.ref ]]
  cancel-in-progress: $[[ github.ref != 'refs/heads/main' ]]

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Last line of defence if .gitignore ever breaks: fail on anything that looks like a real credential in tracked
      # text. Add the skill pack's own credential prefixes. This file names the patterns, so it is not scanned.
      - name: secret scan
        run: |
          if grep -rEn --exclude-dir=.git --exclude=ci.yml --exclude=.env.example \
              'BEGIN( [A-Z]+)* PRIVATE KEY|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|glpat-[0-9A-Za-z_-]{20}|github_pat_[0-9A-Za-z_]{22,}|xox[abpr]-[0-9A-Za-z-]{10,}|(^|[^0-9A-Za-z])sk-[A-Za-z0-9_-]{32,}' \
              --include='*.py' --include='*.json' --include='*.md' --include='*.yml' \
              --include='*.yaml' --include='*.toml' --include='*.tsv' --include='*.txt' \
              --include='*.env' --include='*.js' --include='*.html' .; then
            echo "A credential-like string is tracked. Rotate the credential and remove it from history."
            exit 1
          fi
          echo "OK: no credential-like string found."
      # CLAUDE.md: every pull request names the milestone (M..) it closes, or the story (S..) or rule (P..) it serves;
      # a release is titled "release X.Y.Z"; a re-vendor of the kit ("Re-vendor the kit ...") needs none. The title
      # reaches the shell as a variable, never as script text.
      - name: story id
        env:
          TITLE: $[[ github.event.pull_request.title ]]
        run: |
          if printf '%s\n' "$TITLE" | grep -Eq '(^|[^A-Za-z0-9])([SP][0-9]{2,}|M[0-9]+)([^0-9]|$)|^release [0-9]|^Re-vendor the kit([: ]|$)'; then
            echo "OK: the title names a milestone, a story or a rule, or is a release."
          else
            echo "The title must name the milestone (M..) it closes, or the story (S..) or rule (P..) it serves, or start with 'release X.Y.Z' or 'Re-vendor the kit ' (CLAUDE.md)."
            exit 1
          fi
      # CLAUDE.md: a change a host or an agent can see adds a line under `## [Unreleased]` in CHANGELOG.md. Runtime
      # paths: the code, the registries (ssot/*.tsv, not the .agent.tsv notes), the skill, the references and the
      # console. A change with nothing visible says [no changelog] in its title.
      - name: changelog
        env:
          TITLE: $[[ github.event.pull_request.title ]]
          BASE: $[[ github.event.pull_request.base.sha ]]
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          runtime=$(printf '%s\n' "$changed" | grep -E '^(scripts/|console/|references/|SKILL\.md$|ssot/[A-Za-z_]+\.tsv$)' | grep -vE '^console/ui_rules\.tsv$' || true)
          if [ -z "$runtime" ]; then
            echo "OK: no runtime path changed."
          elif printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "OK: CHANGELOG.md changed."
          elif printf '%s\n' "$TITLE" | grep -Eq '\[no changelog\]'; then
            echo "OK: the title says [no changelog]."
          else
            echo "This change touches:"; printf '%s\n' "$runtime" | head -10
            echo "Add a line under '## [Unreleased]' in CHANGELOG.md, or put [no changelog] in the title if nothing a host or agent can see changes (CLAUDE.md)."
            exit 1
          fi

  # The whole suite is offline: fixtures and temporary folders, no credentials. The runner fails any test file that
  # exits non-zero, prints no "RESULT: N passed" line, or leaves files behind; this job also checks the runner's own
  # last line, so a runner that stops early cannot pass.
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q uv
      - run: |
          if uv run scripts/{{cli}}.py test > test.log 2>&1; then ok=1; else ok=0; fi
          cat test.log
          test "$ok" = 1
          tail -n 1 test.log | grep -Eq '^RESULT: [0-9]+ passed$'
